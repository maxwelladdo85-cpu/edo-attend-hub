workflows:
  edosubeb-ios:
    name: EdoSUBEB Attendance iOS
    max_build_duration: 60

    environment:
      groups:
        - supabase_env
        - ios_signing
      node: 22
      xcode: 16.2
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npx vite build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Setup iOS signing
        script: |
          gem install fastlane -q --no-document
          KEY_RAW=$(echo "${APP_STORE_CONNECT_API_KEY}" | base64 -d 2>/dev/null)
          if echo "$KEY_RAW" | head -c 27 | grep -q "BEGIN"; then
            echo "$KEY_RAW" > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          else
            echo "-----BEGIN EC PRIVATE KEY-----" > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
            echo "$KEY_RAW" | sed 's/.\{64\}/&\n/g' >> /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
            echo "-----END EC PRIVATE KEY-----" >> /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          fi
          ruby -e '
            require "json"
            key = File.read("/tmp/AuthKey_'$APP_STORE_CONNECT_API_KEY_ID'.p8")
            j = {key_id: "'$APP_STORE_CONNECT_API_KEY_ID'", issuer_id: "'$APP_STORE_CONNECT_ISSUER_ID'", key: key, in_house: false, duration: 1200}
            File.write("/tmp/api_key.json", JSON.generate(j))
          '
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          fastlane match appstore \
            --app_identifier "com.edosubeb.attendance" \
            --git_url "https://github.com/maxwelladdo85-cpu/edo-attend-hub.git" \
            --git_branch "match-certs" \
            --api_key_path /tmp/api_key.json \
            --force_for_new_devices true \
            --skip_docs true

      - name: Build & Archive
        script: |
          cd ios/App
          PROFILE_UUID=$(ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1 | xargs -I{} basename {} .mobileprovision)
          echo "Using profile: $PROFILE_UUID"
          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edosubeb.attendance</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
