workflows:
  edosubeb-ios:
    name: EdoSUBEB Attendance iOS
    max_build_duration: 60

    environment:
      groups:
        - supabase_env
        - ios_signing
      node: 22
      xcode: 16.2
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npx vite build

      - name: Sync Capacitor
        script: |
          npx cap sync ios

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update

      - name: Setup iOS signing
        script: |
          if echo "$APP_STORE_CONNECT_API_KEY" | base64 -d 2>/dev/null | head -c 10 | grep -q "BEGIN"; then
            echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          elif echo "$APP_STORE_CONNECT_API_KEY" | head -c 27 | grep -q "BEGIN"; then
            printf '%s' "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          else
            echo "-----BEGIN EC PRIVATE KEY-----" > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
            echo "$APP_STORE_CONNECT_API_KEY" | tr -d '\n' >> /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
            echo "" >> /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
            echo "-----END EC PRIVATE KEY-----" >> /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          fi
          ruby -e '
            require "json"
            key = File.read("/tmp/AuthKey_'$APP_STORE_CONNECT_API_KEY_ID'.p8").strip
            j = {"key_id" => "'$APP_STORE_CONNECT_API_KEY_ID'", "issuer_id" => "'$APP_STORE_CONNECT_ISSUER_ID'", "key" => key, "in_house" => false, "duration" => 1200}
            File.write("/tmp/api_key.json", JSON.generate(j))
          '
          cat /tmp/api_key.json | head -c 100
          echo ""
          gem install fastlane -q --no-document
          mkdir -p fastlane
          cat > fastlane/Fastfile << 'FASTFILE'
          default_platform(:ios)
          platform :ios do
            lane :setup_signing do
              api_key = app_store_connect_api_key(key_path: "/tmp/api_key.json")
              match(
                type: "appstore",
                app_identifier: "com.edosubeb.attendance",
                api_key: api_key,
                force_for_new_devices: true,
                force: true
              )
            end
          end
          FASTFILE
          fastlane setup_signing

      - name: Build & Archive
        script: |
          cd ios/App
          PROFILE_UUID=$(ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1 | xargs -I{} basename {} .mobileprovision)
          echo "Using profile: $PROFILE_UUID"
          cat > /tmp/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edosubeb.attendance</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID"

      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath "$CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive" \
            -exportOptionsPlist /tmp/exportOptions.plist \
            -exportPath "$CM_BUILD_DIR/build/ios/ipa"

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
