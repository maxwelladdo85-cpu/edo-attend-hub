workflows:
  edosubeb-ios:
    name: EdoSUBEB Attendance iOS
    max_build_duration: 60

    environment:
      groups:
        - supabase_env
        - ios_signing
      node: 20
      xcode: 16.2
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npx vite build

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update

      - name: Install Fastlane & setup signing
        script: |
          gem install fastlane -q --no-document
          mkdir -p /tmp/fastlane
          echo "Key starts with: $(echo "$APP_STORE_CONNECT_API_KEY" | head -c 30)"
          echo "Key ID: $APP_STORE_CONNECT_API_KEY_ID"
          echo "Issuer ID: $APP_STORE_CONNECT_ISSUER_ID"
          echo "TEAM ID: $APPLE_TEAM_ID"
          if echo "$APP_STORE_CONNECT_API_KEY" | base64 -d 2>/dev/null | head -c 10 | grep -q "BEGIN"; then
            echo "Key is base64-encoded PEM"
            echo "$APP_STORE_CONNECT_API_KEY" | base64 -d > /tmp/AuthKey.p8
          elif echo "$APP_STORE_CONNECT_API_KEY" | head -c 27 | grep -q "BEGIN"; then
            echo "Key is already raw PEM"
            printf '%s' "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey.p8
          else
            echo "Key is base64 DER, wrapping in PEM"
            echo "-----BEGIN EC PRIVATE KEY-----" > /tmp/AuthKey.p8
            echo "$APP_STORE_CONNECT_API_KEY" >> /tmp/AuthKey.p8
            echo "-----END EC PRIVATE KEY-----" >> /tmp/AuthKey.p8
          fi
          cat > /tmp/fastlane/Fastfile << 'FASTFILE'
          default_platform(:ios)
          platform :ios do
            lane :setup_signing do
              api_key = app_store_connect_api_key(
                key_content: File.read("/tmp/AuthKey.p8"),
                key_id: ENV["APP_STORE_CONNECT_API_KEY_ID"],
                issuer_id: ENV["APP_STORE_CONNECT_ISSUER_ID"],
                duration: 1200,
                in_house: false
              )
              produce(
                api_key: api_key,
                app_identifier: "com.edosubeb.attendance",
                app_name: "EdoSUBEB Attendance",
                team_id: ENV["APPLE_TEAM_ID"],
                skip_creation: false,
                force: true
              )
              cert(api_key: api_key, output_path: "/tmp/certs", force: true)
              sigh(api_key: api_key, app_identifier: "com.edosubeb.attendance", output_path: "/tmp/profiles", force: true, development: false)
            end
          end
          FASTFILE
          cd /tmp && fastlane setup_signing

          ls -la /tmp/certs/ 2>/dev/null || echo "No certs dir"
          ls -la /tmp/profiles/ 2>/dev/null || echo "No profiles dir"

          security create-keychain -p "" build.keychain 2>/dev/null || true
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          CERT_FILE=$(ls /tmp/certs/*.p12 2>/dev/null | head -1)
          if [ -n "$CERT_FILE" ]; then
            security import "$CERT_FILE" -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          fi

          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp /tmp/profiles/*.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || true
          ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles installed"

      - name: Build & Archive
        script: |
          cd ios/App
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          security list-keychains -d user -s build.keychain-db login.keychain-db
          security default-keychain -s build.keychain-db
          security unlock-keychain -p "" build.keychain-db

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID

      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ios/ipa \
            -allowProvisioningUpdates

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
