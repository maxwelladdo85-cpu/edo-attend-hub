workflows:
  edosubeb-ios:
    name: EdoSUBEB Attendance iOS
    max_build_duration: 60

    environment:
      groups:
        - supabase_env
        - ios_signing
      node: 20
      xcode: 16.2
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: "main"
          include: true
          source: true

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Build web assets
        script: |
          npx vite build

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install --repo-update

      - name: Install Fastlane & setup signing
        script: |
          gem install fastlane -q --no-document
          printf '%s' "$APP_STORE_CONNECT_API_KEY" > /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8
          ruby -e '
            require "json"
            key = File.read("/tmp/AuthKey_'$APP_STORE_CONNECT_API_KEY_ID'.p8").strip
            j = {"key_id" => "'$APP_STORE_CONNECT_API_KEY_ID'", "issuer_id" => "'$APP_STORE_CONNECT_ISSUER_ID'", "key" => key, "in_house" => false, "duration" => 1200}
            File.write("/tmp/api_key.json", JSON.generate(j))
          ' 2>&1 || {
            echo "JSON generate failed, trying manual JSON construction..."
            cat > /tmp/api_key.json << KEYEOF
          {"key_id":"'$APP_STORE_CONNECT_API_KEY_ID'","issuer_id":"'$APP_STORE_CONNECT_ISSUER_ID'","key":"$(cat /tmp/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8 | tr -d '\n' | sed 's/"/\\"/g')","in_house":false,"duration":1200}
          KEYEOF
          }
          cat /tmp/api_key.json | head -c 200
          echo ""
          echo "---"
          echo "Key ID: $APP_STORE_CONNECT_API_KEY_ID"
          echo "Issuer ID: $APPLE_TEAM_ID"

          fastlane cert \
            --api_key_path /tmp/api_key.json \
            --team_id $APPLE_TEAM_ID \
            --output_path /tmp/certs \
            --force 2>&1 || echo "cert failed, continuing..."

          fastlane sigh \
            --app_identifier com.edosubeb.attendance \
            --api_key_path /tmp/api_key.json \
            --team_id $APPLE_TEAM_ID \
            --output_path /tmp/profiles \
            --force 2>&1 || echo "sigh failed, continuing..."

          ls -la /tmp/certs/ 2>/dev/null || echo "No certs dir"
          ls -la /tmp/profiles/ 2>/dev/null || echo "No profiles dir"

          security create-keychain -p "" build.keychain 2>/dev/null || true
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          CERT_FILE=$(ls /tmp/certs/*.p12 2>/dev/null | head -1)
          if [ -n "$CERT_FILE" ]; then
            security import "$CERT_FILE" -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" build.keychain
          fi

          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp /tmp/profiles/*.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || true
          ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "No profiles installed"

      - name: Build & Archive
        script: |
          cd ios/App
          PROFILE_UUID=$(ls ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.mobileprovision 2>/dev/null | head -1 | xargs -I{} basename {} .mobileprovision)
          cat > ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.edosubeb.attendance</key>
              <string>${PROFILE_UUID}</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
          </dict>
          </plist>
          EOF

          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="${PROFILE_UUID}" \
            DEVELOPMENT_TEAM=$APPLE_TEAM_ID

      - name: Export IPA
        script: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/ios/xcarchive/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $CM_BUILD_DIR/build/ios/ipa

    artifacts:
      - $CM_BUILD_DIR/build/ios/ipa/*.ipa

    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_API_KEY
        key_id: $APP_STORE_CONNECT_API_KEY_ID
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_app_store: true
